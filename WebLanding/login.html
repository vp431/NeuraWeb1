<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NeuraCon</title>
  <meta name="description" content="Login to NeuraCon, the AI-powered real estate sales platform. Coming soon.">
  <meta name="theme-color" content="#F5F1E8">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;500;600&family=Caveat:wght@500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Particles Background -->
  <canvas id="particles-canvas"></canvas>

  <div class="login-page">
    <div class="login-card glass-card">
      <a href="index.html" class="navbar-logo" style="justify-content: center; margin-bottom: 32px;">
        <img src="assets/images/logo-mark.svg" alt="NeuraCon Icon" style="height: 48px;">
        <span class="gradient-text" style="font-size: 1.6rem;">NeuraCon</span>
      </a>

      <div class="login-coming-soon">
        Coming Soon
      </div>

      <p class="login-message" style="margin-bottom: 32px;">
        We're building something <strong>extraordinary</strong> for real estate sales.
        <br>The platform will be live soon.
      </p>

      <div class="login-form-group">
        <input type="email" placeholder="Email address" disabled>
      </div>
      <div class="login-form-group">
        <input type="password" placeholder="Password" disabled>
      </div>

      <button class="btn btn-primary login-submit" disabled>
        Sign In
      </button>

      <p class="login-message" style="margin-top: 32px; font-size: 0.85rem;">
        Want early access?
        <a href="index.html#waitlist" style="color: var(--accent-blue); font-weight: 600;">&nbsp;Join the Waitlist →</a>
      </p>

      <a href="index.html" class="login-back">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Homepage
      </a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
